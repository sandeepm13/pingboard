# Deploy = build the images and (re)start the containers of one environment
# on the VM. Runs on the self-hosted runner installed ON the VM, because
# GitHub's machines can't reach a VM on a home network.
#
#   push to dev  → dev  (port 3200, secrets *_DEV)
#   push to uat  → uat  (port 3100, secrets *_UAT)
#   push to main → prod (port 3000, secrets *_PROD)
#
# Only pushes (merged pull requests) deploy. Pull requests never run on the VM
# (ci.yml runs them on GitHub's machines), so unreviewed code can't reach it.

name: Deploy

on:
  push:
    branches: [dev, uat, main]
  # "Run workflow" button in the Actions tab: redeploys the chosen branch.
  workflow_dispatch:

permissions:
  contents: read

# One deploy per branch at a time; a second push waits instead of cancelling a
# deploy halfway through.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    env:
      # Branch → environment. Any other branch gets "" and the first step stops.
      APP_ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'uat' && 'uat' || github.ref_name == 'dev' && 'dev' || '' }}
      SECRET_SUFFIX: ${{ github.ref_name == 'main' && 'PROD' || github.ref_name == 'uat' && 'UAT' || github.ref_name == 'dev' && 'DEV' || '' }}
      WEB_PORT: ${{ github.ref_name == 'main' && '3000' || github.ref_name == 'uat' && '3100' || github.ref_name == 'dev' && '3200' || '' }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Pick the environment
        run: |
          if [ -z "$APP_ENV" ]; then
            echo "::error::Branch '${GITHUB_REF_NAME}' has no environment. Only dev, uat and main deploy."
            exit 1
          fi
          echo "ENV_FILE=/opt/pingboard/$APP_ENV/.env" >> "$GITHUB_ENV"
          echo "Deploying $GITHUB_REF_NAME → $APP_ENV (port $WEB_PORT, secrets *_$SECRET_SUFFIX, commit $IMAGE_TAG)"

      - name: Check out the code
        uses: actions/checkout@v5

      # secrets[format(...)] picks e.g. MONGODB_URI_PROD by name. A missing
      # secret stays empty: it never falls back to another environment's.
      - name: Check secrets, then write the env file
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          MONGODB_URI: ${{ secrets[format('MONGODB_URI_{0}', env.SECRET_SUFFIX)] }}
          AUTH_SECRET: ${{ secrets[format('AUTH_SECRET_{0}', env.SECRET_SUFFIX)] }}
          ENCRYPTION_KEY: ${{ secrets[format('ENCRYPTION_KEY_{0}', env.SECRET_SUFFIX)] }}
          REDIS_PASSWORD: ${{ secrets[format('REDIS_PASSWORD_{0}', env.SECRET_SUFFIX)] }}
          AUTH_GOOGLE_ID: ${{ secrets[format('AUTH_GOOGLE_ID_{0}', env.SECRET_SUFFIX)] }}
          AUTH_GOOGLE_SECRET: ${{ secrets[format('AUTH_GOOGLE_SECRET_{0}', env.SECRET_SUFFIX)] }}
          AUTH_GITHUB_ID: ${{ secrets[format('AUTH_GITHUB_ID_{0}', env.SECRET_SUFFIX)] }}
          AUTH_GITHUB_SECRET: ${{ secrets[format('AUTH_GITHUB_SECRET_{0}', env.SECRET_SUFFIX)] }}
          EMAIL_PROVIDER: ${{ secrets[format('EMAIL_PROVIDER_{0}', env.SECRET_SUFFIX)] }}
          EMAIL_FROM: ${{ secrets[format('EMAIL_FROM_{0}', env.SECRET_SUFFIX)] }}
          RESEND_API_KEY: ${{ secrets[format('RESEND_API_KEY_{0}', env.SECRET_SUFFIX)] }}
          SMTP_HOST: ${{ secrets[format('SMTP_HOST_{0}', env.SECRET_SUFFIX)] }}
          SMTP_PORT: ${{ secrets[format('SMTP_PORT_{0}', env.SECRET_SUFFIX)] }}
          SMTP_SECURE: ${{ secrets[format('SMTP_SECURE_{0}', env.SECRET_SUFFIX)] }}
          SMTP_USER: ${{ secrets[format('SMTP_USER_{0}', env.SECRET_SUFFIX)] }}
          SMTP_PASS: ${{ secrets[format('SMTP_PASS_{0}', env.SECRET_SUFFIX)] }}
        run: |
          required="MONGODB_URI AUTH_SECRET ENCRYPTION_KEY REDIS_PASSWORD"
          optional="AUTH_GOOGLE_ID AUTH_GOOGLE_SECRET AUTH_GITHUB_ID AUTH_GITHUB_SECRET EMAIL_PROVIDER EMAIL_FROM RESEND_API_KEY SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASS"
          problems=0

          # 1. Report "set" / "missing" only. Never print a value.
          echo "Repository variable:"
          if [ -n "${VM_HOST:-}" ]; then echo "  VM_HOST: set"; else echo "  VM_HOST: MISSING"; problems=1; fi
          echo "Secrets (*_$SECRET_SUFFIX):"
          for name in $required; do
            if [ -n "${!name:-}" ]; then echo "  ${name}_$SECRET_SUFFIX: set"; else echo "  ${name}_$SECRET_SUFFIX: MISSING"; problems=1; fi
          done
          for name in $optional; do
            if [ -n "${!name:-}" ]; then echo "  ${name}_$SECRET_SUFFIX: set"; else echo "  ${name}_$SECRET_SUFFIX: not set (optional)"; fi
          done
          # Values are written as KEY='value': compose reads them literally (a $
          # in a password stays a $), but they can't hold a ' or a line break.
          for name in $required $optional; do
            case "${!name:-}" in
              *"'"* | *$'\n'*) echo "::error::${name}_$SECRET_SUFFIX contains a ' or a line break, which the env file can't hold."; problems=1 ;;
            esac
          done
          if [ "$problems" != 0 ]; then
            echo "::error::Fix the items above in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

          # 2. Write /opt/pingboard/<env>/.env (readable by the deploy user only).
          env_dir="$(dirname "$ENV_FILE")"
          if [ ! -d "$env_dir" ] || [ ! -w "$env_dir" ]; then
            echo "::error::$env_dir is missing or not writable by $(whoami). See DEPLOYMENT.md → one-time VM setup."
            exit 1
          fi

          # Smaller limits and a lower CPU share for dev/uat, so they can't slow prod down.
          if [ "$APP_ENV" = prod ]; then
            web_cpus=1.5; web_memory=1g; worker_cpus=1.0; worker_memory=512m; cpu_shares=1024
          else
            web_cpus=0.75; web_memory=768m; worker_cpus=0.5; worker_memory=384m; cpu_shares=256
          fi
          app_url="http://$VM_HOST:$WEB_PORT"

          umask 077
          tmp="$env_dir/.env.next"
          : > "$tmp"
          put() {
            if [ -n "$2" ]; then printf "%s='%s'\n" "$1" "$2" >> "$tmp"; fi
          }
          echo "# Written by .github/workflows/deploy.yml. The next deploy overwrites it." >> "$tmp"
          put APP_ENV "$APP_ENV"
          put ENV_FILE "$ENV_FILE"
          put WEB_PORT "$WEB_PORT"
          put IMAGE_TAG "$IMAGE_TAG"
          put APP_URL "$app_url"
          put AUTH_URL "$app_url"
          put AUTH_TRUST_HOST true
          put MONGODB_DB "pingboard_$APP_ENV"
          put WEB_CPUS "$web_cpus"
          put WEB_MEMORY "$web_memory"
          put WORKER_CPUS "$worker_cpus"
          put WORKER_MEMORY "$worker_memory"
          put CPU_SHARES "$cpu_shares"
          for name in $required $optional; do
            put "$name" "${!name:-}"
          done
          chmod 600 "$tmp"
          mv -f "$tmp" "$ENV_FILE"
          echo "Wrote $ENV_FILE (values not shown)."

      - name: Build images and start containers
        run: docker compose -p "pingboard-$APP_ENV" --env-file "$ENV_FILE" up -d --build --remove-orphans

      - name: Wait for /api/health
        run: |
          url="http://localhost:$WEB_PORT/api/health"
          for attempt in $(seq 1 24); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || true)"
            if [ "$code" = 200 ]; then
              echo "Healthy: $url answered 200."
              exit 0
            fi
            echo "Attempt $attempt/24: got ${code:-nothing}, trying again in 5 s"
            sleep 5
          done
          echo "::error::$url did not answer 200 within 2 minutes."
          exit 1

      - name: Show containers and recent logs (only when something failed)
        if: failure() && env.APP_ENV != ''
        run: |
          docker compose -p "pingboard-$APP_ENV" --env-file "$ENV_FILE" ps -a || true
          docker compose -p "pingboard-$APP_ENV" --env-file "$ENV_FILE" logs --no-color --tail 100 || true

      # Keep the newest 3 images per environment (for rollbacks), remove the rest.
      - name: Clean up old images
        if: success()
        run: |
          docker image prune -f
          for service in web worker; do
            repo="pingboard-$APP_ENV-$service"
            old="$(docker image ls "$repo" --format '{{.CreatedAt}}|{{.Repository}}:{{.Tag}}' \
              | sort -r \
              | awk -F'|' '$2 !~ /:<none>$/ { n++; if (n > 3) print $2 }')"
            for image in $old; do
              echo "Removing $image"
              docker image rm "$image" || echo "  still in use, kept"
            done
          done
          # Build cache older than a week.
          docker builder prune -f --filter until=168h

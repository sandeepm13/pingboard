# CI = "continuous integration": checks every pull request before it can be
# merged. Runs on GitHub's own machines (ubuntu-latest), never on the VM, and
# deploys nothing. It uses no secrets.

name: CI

on:
  pull_request:
    branches: [dev, uat, main]

permissions:
  contents: read

# A new push to the same pull request cancels the older, now outdated run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      # --if-present: skip cleanly when the script doesn't exist.
      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck (app + worker)
        run: npm run typecheck --if-present

      # Integration tests skip themselves without TEST_MONGODB_URI / TEST_REDIS_URL.
      - name: Unit tests
        run: npm run test --if-present

  docker:
    name: Build Docker images
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      # Build only: nothing is pushed or started. APP_URL is a placeholder;
      # each environment builds its own web image when it deploys.
      - name: Build web image
        run: >-
          docker build
          --file Dockerfile
          --build-arg APP_URL=http://localhost:3000
          --build-arg NEXT_PUBLIC_APP_ENV=ci
          --tag pingboard-ci-web:${{ github.sha }}
          .

      - name: Build worker image
        run: >-
          docker build
          --file worker/Dockerfile
          --tag pingboard-ci-worker:${{ github.sha }}
          .
